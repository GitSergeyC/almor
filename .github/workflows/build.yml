name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Accept SDK licences
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      # Wrapper в репозитории нет (бинарник .jar не хранится),
      # поэтому ставим Gradle 8.9 напрямую — версия, совместимая с AGP 8.5.2.
      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      # Тесты не блокируют сборку: падение теста не должно лишать APK.
      - name: Run unit tests
        continue-on-error: true
        run: |
          set -o pipefail
          gradle test --no-daemon --stacktrace 2>&1 | tee test-output.txt

      - name: Build debug APK
        run: |
          set -o pipefail
          gradle assembleDebug --no-daemon --stacktrace 2>&1 | tee build-output.txt

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: alarmclock-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 90

      # Публикуем APK в релиз: прямая ссылка, которую можно открыть
      # с телефона без входа в GitHub (артефакты Actions так не умеют).
      - name: Publish APK to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk alarmclock-debug.apk
          gh release delete latest --yes --cleanup-tag 2>/dev/null || true
          gh release create latest alarmclock-debug.apk \
            --title "AlarmClock — последняя сборка" \
            --notes "Debug-сборка из коммита ${GITHUB_SHA:0:7} от $(date -u '+%d.%m.%Y %H:%M UTC').

          Скачайте \`alarmclock-debug.apk\` и установите на телефон,
          разрешив установку из неизвестных источников."

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            test-output.txt
            build-output.txt
            app/build/reports/tests/**
          if-no-files-found: warn
          retention-days: 14
