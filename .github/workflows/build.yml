name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Accept SDK licences
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      # Wrapper в репозитории нет (бинарник .jar не хранится),
      # поэтому ставим Gradle 8.9 напрямую — версия, совместимая с AGP 8.5.2.
      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      # Тесты не блокируют сборку: падение теста не должно лишать APK.
      - name: Run unit tests
        continue-on-error: true
        run: |
          set -o pipefail
          gradle test --no-daemon --stacktrace 2>&1 | tee test-output.txt

      - name: Build debug APK
        run: |
          set -o pipefail
          gradle assembleDebug --no-daemon --stacktrace 2>&1 | tee build-output.txt

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: alarmclock-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 90

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            test-output.txt
            build-output.txt
            app/build/reports/tests/**
          if-no-files-found: warn
          retention-days: 14
